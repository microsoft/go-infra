<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run a process · {{if .Brand}}{{.Brand}} {{end}}Release UI</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-brand="{{.Brand}}">
{{template "topbar" .}}

  <main class="dashboard-main">
    <section class="hero dashboard-hero">
      <div>
        <p class="eyebrow">Start new work</p>
        <h1>Run a process</h1>
        <p class="hero-copy">Choose a release process.</p>
      </div>
    </section>
    <div id="process-list" class="process-list">
      {{range .Processes}}
      <a class="process-card" href="{{.Href}}">
        <span class="process-mark">{{.Mark}}</span>
        <div>
          <h2>{{.Name}}</h2>
          <p>{{.Description}}</p>
        </div>
      </a>
      {{end}}
    </div>
  </main>
</body>
</html>
