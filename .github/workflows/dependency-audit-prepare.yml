# External callers may audit only their own repository. Central runs use
# DEPENDENCY_AUDIT_REPOSITORIES. Use only one scheduler for each target.
# Local audits use GITHUB_TOKEN. An optional App enables automatic draft PRs.
# Cross-repository runs require an App installed on the selected target.

name: Prepare a dependency audit target

on:
  workflow_call:
    secrets:
      DEPENDENCY_AUDIT_APP_PRIVATE_KEY:
        description: "Private key for the GitHub App installed on the target repository"
        required: false
    inputs:
      target_repo:
        required: true
        type: string
      mode:
        description: "audit, apply, or link a published migration"
        default: audit
        type: string
      app_id:
        default: ""
        type: string
      initial_sha:
        default: ""
        type: string
      area:
        default: ""
        type: string
      issue:
        default: 0
        type: number
      replace_pr:
        default: 0
        type: number
    outputs:
      control_sha:
        value: ${{ jobs.prepare.outputs.control_sha }}
      app_id:
        value: ${{ jobs.prepare.outputs.app_id }}
      publisher:
        value: ${{ jobs.prepare.outputs.publisher }}
      tracker:
        value: ${{ jobs.prepare.outputs.tracker }}
      owner:
        value: ${{ jobs.prepare.outputs.owner }}
      repo:
        value: ${{ jobs.prepare.outputs.repo }}
      key:
        value: ${{ jobs.prepare.outputs.key }}
      branch:
        value: ${{ jobs.prepare.outputs.branch }}
      base:
        value: ${{ jobs.prepare.outputs.base }}
      head:
        value: ${{ jobs.prepare.outputs.head }}
      work_branch:
        value: ${{ jobs.prepare.outputs.work_branch }}
      module:
        value: ${{ jobs.prepare.outputs.module }}
      issue:
        value: ${{ jobs.prepare.outputs.issue }}
      existing:
        value: ${{ jobs.prepare.outputs.existing }}
      replaces:
        value: ${{ jobs.prepare.outputs.replaces }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      control_sha: ${{ job.workflow_sha }}
      app_id: ${{ steps.auth.outputs.app_id }}
      publisher: ${{ steps.context.outputs.publisher }}
      tracker: ${{ steps.context.outputs.tracker }}
      owner: ${{ steps.target.outputs.owner }}
      repo: ${{ steps.target.outputs.repo }}
      key: ${{ steps.target.outputs.key }}
      branch: ${{ steps.context.outputs.branch }}
      base: ${{ steps.context.outputs.base_sha }}
      head: ${{ steps.context.outputs.head_sha }}
      work_branch: ${{ steps.context.outputs.work_branch }}
      module: ${{ steps.context.outputs.module }}
      issue: ${{ steps.context.outputs.tracker_issue }}
      existing: ${{ steps.context.outputs.existing }}
      replaces: ${{ steps.context.outputs.replaces_pr }}
    env:
      DEPENDENCY_AUDIT_REPOSITORIES: ${{ github.repository != 'microsoft/go-infra' && format('["{0}"]', github.repository) || vars.DEPENDENCY_AUDIT_REPOSITORIES }}
      DEPENDENCY_AUDIT_ENABLE_APPLY: ${{ vars.DEPENDENCY_AUDIT_ENABLE_APPLY }}
      DEPENDENCY_AUDIT_CONTROL_PRIVATE: ${{ github.event.repository.private }}
      TARGET: ${{ inputs.target_repo }}
      MODE: ${{ inputs.mode }}
      INITIAL: ${{ inputs.initial_sha }}
      AREA: ${{ inputs.area }}
      ISSUE: ${{ inputs.issue }}
      REPLACE_PR: ${{ inputs.replace_pr }}
      APP_CLIENT_ID: ${{ inputs.app_id }}
      HAS_APP_KEY: ${{ secrets.DEPENDENCY_AUDIT_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Require the caller's default branch
        if: github.event.repository.fork == true || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Dependency automation must run from the caller's default branch, not a fork."
          exit 1
      - name: Check the requested operation
        run: |
          case "$MODE" in
            audit) [[ -z "$AREA" && "$ISSUE" = 0 ]] || { echo "::error::Audit does not accept an area or tracker issue."; exit 1; } ;;
            apply|link) [[ -n "$AREA" && -z "$INITIAL" ]] || { echo "::error::Apply and link require an area and do not accept an initial SHA."; exit 1; } ;;
            *) echo "::error::Unknown dependency operation"; exit 1 ;;
          esac
      - name: Select repository-local or App authentication
        id: auth
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          app_id="$APP_CLIENT_ID"
          if [[ "$MODE" == audit && "$TARGET" == "$CALLER_REPOSITORY" ]]; then
            app_id=""
          elif [[ ( -n "$app_id" && "$HAS_APP_KEY" != true ) || ( -z "$app_id" && "$HAS_APP_KEY" == true ) ]]; then
            echo "::error::Configure both the App client ID and private key, or neither."
            exit 1
          fi
          if [[ "$TARGET" != "$CALLER_REPOSITORY" && -z "$app_id" ]]; then
            echo "::error::Cross-repository dependency automation requires a GitHub App."
            exit 1
          fi
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
      - name: Checkout the pinned go-infra implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/go-infra
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build the dependency audit helper
        run: go build -o "$RUNNER_TEMP/dependencyaudit" ./cmd/dependencyaudit
      - name: Validate enrollment before granting target access
        id: target
        run: |
          "$RUNNER_TEMP/dependencyaudit" targets -repo "$TARGET" -area "$AREA" \
            -initial-sha "$INITIAL" -issue "$ISSUE" -replace-pr "$REPLACE_PR"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: reader
        if: steps.auth.outputs.app_id != ''
        with:
          client-id: ${{ steps.auth.outputs.app_id }}
          private-key: ${{ secrets.DEPENDENCY_AUDIT_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repo }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: ${{ inputs.mode != 'audit' && 'read' || '' }}
      - name: Read the issue checkpoint and select the immutable source
        id: context
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token || github.token }}
          PUBLISHER: ${{ steps.reader.outputs.app-slug && format('{0}[bot]', steps.reader.outputs.app-slug) || 'github-actions[bot]' }}
          TRACKER: ${{ inputs.target_repo == github.repository && 'github-actions[bot]' || format('{0}[bot]', steps.reader.outputs.app-slug) }}
        run: |
          "$RUNNER_TEMP/dependencyaudit" prepare -repo "$TARGET" -initial-sha "$INITIAL" \
            -area "$AREA" -issue "$ISSUE" -replace-pr "$REPLACE_PR" -publisher-login "$PUBLISHER" \
            -tracker-login "$TRACKER" \
            -output "$RUNNER_TEMP/dependency-audit/context.json"
      - name: Mint a comment-only token for an existing PR
        if: inputs.mode != 'audit' && steps.context.outputs.existing == 'true' && inputs.target_repo != github.repository
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: linker
        with:
          client-id: ${{ steps.auth.outputs.app_id }}
          private-key: ${{ secrets.DEPENDENCY_AUDIT_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repo }}
          permission-issues: write
          permission-pull-requests: read
      - name: Require the published migration before reporting success
        if: inputs.mode == 'link' && steps.context.outputs.existing != 'true'
        run: |
          echo "::error::Migration publication succeeded without a discoverable PR or validated branch."
          exit 1
      - name: Refresh the existing PR link
        if: inputs.mode != 'audit' && steps.context.outputs.existing == 'true'
        id: link
        env:
          GH_TOKEN: ${{ steps.linker.outputs.token || github.token }}
          PUBLISHER: ${{ steps.context.outputs.publisher }}
          TRACKER: ${{ steps.context.outputs.tracker }}
        run: |
          "$RUNNER_TEMP/dependencyaudit" link -repo "$TARGET" -area "$AREA" -replace-pr "$REPLACE_PR" \
            -publisher-login "$PUBLISHER" -tracker-login "$TRACKER" -input "$RUNNER_TEMP/dependency-audit/context.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.mode == 'audit' || steps.context.outputs.existing == 'false'
        with:
          name: dependency-context-${{ steps.target.outputs.key }}
          path: ${{ runner.temp }}/dependency-audit/context.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true
