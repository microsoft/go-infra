# This pipeline runs rolling validation.
# For go-infra: CodeQL on active branch.
# For internal go-mirror and go-images-versions: CG on active branches.

# official: https://dev.azure.com/dnceng/internal/_build?definitionId=1356
# unofficial: https://dev.azure.com/dnceng/internal/_build?definitionId=1496

pipelineymlgen:
  output:
    - file: rolling-internal-validation-pipeline-unofficial.yml
      data:
        official: false
    - file: rolling-internal-validation-pipeline.yml
      data:
        official: true
---

parameters:
  - ${ inlinetemplate "util/info.gen.yml" }:
      desc: This pipeline runs rolling validation, like CodeQL, for go-infra, internal go-mirror, and internal go-images-versions branches.
  - name: enableCodeQL
    displayName: '[Debug input] Enable CodeQL, ignoring cadence. Use to try modifications in dev branches.'
    type: boolean
    default: ${ yml (not .official) }
  - name: disableTSA
    displayName: '[Debug input] Disable TSA reporting. Use to try modifications in dev branches.'
    type: boolean
    default: ${ yml (not .official) }

trigger: none
pr: none
schedules:
  - ${ inlineif .official }:
    - cron: '45 11 * * 2'
      displayName: Periodic Validation
      branches:
        include:
          - main

variables:
  - template: variables/pipeline.yml
  - template: variables/codeql.yml
  - ${ inlineif (not .official) }:
    # The default cadence is ok for official branches. The cadence is per-branch.
    # For a dev build, the cadence would prevent dev iteration.
    # https://eng.ms/docs/cloud-ai-platform/devdiv/one-engineering-system-1es/1es-docs/codeql/codeql-general-faq#how-do-i-check-if-my-project-is-onboarded
    - name: Codeql.Cadence
      value: 0

resources:
  repositories:

    - repository: GoMirror
      type: git
      name: internal/microsoft-go-mirror
      ${ inlineif .official }:
        trigger:
          branches:
            include:
              - master
              - release-branch.go*

    - repository: GoImagesVersions
      type: git
      name: internal/microsoft-go-images-versions
      ${ inlineif .official }:
        trigger:
          branches:
            include:
              - main

    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  ${ inlineif .official }:
    template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  ${ inlineelse }:
    template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: NetCore1ESPool-Internal
      image: 1es-windows-2022
      os: windows
    sdl:
      codeql:
        enabledOnNonDefaultBranches: ${{ parameters.enableCodeQL }}
        language: go
      suppression:
        suppressionFile: $(Build.SourcesDirectory)/.config/guardian/.gdnsuppress
      tsa:
        enabled: ${{ not(parameters.disableTSA) }}
        config:
          codebaseName: 'Go'
          notificationAliases:
            - 'golangdev@microsoft.com'
          codebaseAdmins:
            - 'redmond\golangdev'
          instanceUrl: 'https://devdiv.visualstudio.com/'
          projectName: 'DEVDIV'
          areaPath: 'DevDiv\GoLang'
          iterationPath: 'DevDiv'
          allTools: true
      sourceRepositoriesToScan:
        include:
          - repository: GoMirror
          - repository: GoImagesVersions

    stages:
      # Don't run CodeQL if this is triggered by a push to one of the internal repositories.
      - ${{ if in(variables['Build.Reason'], 'Schedule', 'Manual') }}:
        - stage: GoInfraCodeQL
          displayName: go-infra CodeQL
          dependsOn: []
          jobs:
            - job: Analyze
              workspace:
                clean: all
              steps:
                - checkout: self

                - task: GoTool@0
                  inputs:
                    version: 1.24.1

                - script: |
                    go build ./...
                  displayName: go

      - ${ inlinetemplate "util/cg-stage.gen.yml" }:
          stage: MirrorCG
          displayName: go-mirror CG
          repository: GoMirror

      - ${ inlinetemplate "util/cg-stage.gen.yml" }:
          stage: ImagesVersionsCG
          displayName: go-images-versions CG
          repository: GoImagesVersions
