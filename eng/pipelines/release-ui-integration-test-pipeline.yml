# This manually triggered pipeline is reserved for safely exercising future release UI queueing
# and monitoring. The current pipeline 1023 integration is read-only and does not queue this.
#
# It intentionally accepts the same template parameters as the direct microsoft-go-images
# pipeline, but it does not build, sign, or publish images. The ReleaseUISessionID pipeline
# variable is required and is used to reconcile a queued run after a client restart.
#
# internal (unofficial): pipeline definition must be created after this file is merged.

parameters:
  - name: sourceBuildPipelineRunId
    displayName: Build ID whose artifacts would be published by the real pipeline. It is only printed.
    type: string
    default: '$(Build.BuildId)'

  - name: publishRepoPrefix
    displayName: Repository prefix the real pipeline would publish to. It is only printed.
    type: string
    default: public/

trigger: none
pr: none

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: NetCore1ESPool-Internal
      image: 1es-ubuntu-2204
      os: linux
    sdl:
      sourceAnalysisPool:
        name: NetCore1ESPool-Svc-Internal
        image: 1es-windows-2022
        os: windows
      suppression:
        suppressionFile: $(Build.SourcesDirectory)/.config/guardian/.gdnsuppress
      tsa:
        enabled: false

    stages:
      - stage: Test
        displayName: Release UI integration test
        jobs:
          - job: NoOp
            displayName: Validate request and report success
            workspace:
              clean: all
            steps:
              - checkout: none

              - bash: |
                  set -euo pipefail

                  if [[ ! "$RELEASE_UI_SESSION_ID" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
                    echo "##vso[task.logissue type=error]ReleaseUISessionID is missing or invalid."
                    exit 1
                  fi

                  echo "Release UI integration test"
                  echo "Correlation ID: $RELEASE_UI_SESSION_ID"
                  echo "Build ID: $BUILD_ID"
                  echo "Pipeline: $PIPELINE_NAME"
                  echo "Artifact source build (no-op): $SOURCE_BUILD_PIPELINE_RUN_ID"
                  echo "Publish prefix (no-op): $PUBLISH_REPO_PREFIX"
                displayName: Validate pipeline-1023-compatible request
                env:
                  RELEASE_UI_SESSION_ID: $(ReleaseUISessionID)
                  BUILD_ID: $(Build.BuildId)
                  PIPELINE_NAME: $(Build.DefinitionName)
                  SOURCE_BUILD_PIPELINE_RUN_ID: ${{ parameters.sourceBuildPipelineRunId }}
                  PUBLISH_REPO_PREFIX: ${{ parameters.publishRepoPrefix }}

              - bash: |
                  set -euo pipefail
                  echo "No-op run is active so the release UI can observe an in-progress build."
                  sleep 10
                  echo "Release UI integration test completed successfully."
                displayName: Emit observable no-op activity
