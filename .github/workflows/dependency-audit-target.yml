name: Audit dependency history

on:
  workflow_call:
    secrets:
      DEPENDENCY_AUDIT_APP_PRIVATE_KEY:
        required: false
    inputs:
      target_repo:
        required: true
        type: string
      initial_sha:
        default: ""
        type: string
      app_id:
        description: "Optional App client ID; required for cross-repository runs"
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ inputs.target_repo }}
  cancel-in-progress: false

jobs:
  prepare:
    uses: ./.github/workflows/dependency-audit-prepare.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      target_repo: ${{ inputs.target_repo }}
      initial_sha: ${{ inputs.initial_sha }}
      app_id: ${{ inputs.app_id || vars.DEPENDENCY_AUDIT_APP_ID }}

  audit:
    needs: prepare
    uses: ./.github/workflows/dependency-audit-agent.lock.yml
    secrets: inherit
    permissions:
      actions: write
      contents: read
      issues: write
      copilot-requests: write
    with:
      target_repo: ${{ inputs.target_repo }}
      owner: ${{ needs.prepare.outputs.owner }}
      repo: ${{ needs.prepare.outputs.repo }}
      key: ${{ needs.prepare.outputs.key }}
      branch: ${{ needs.prepare.outputs.branch }}
      base: ${{ needs.prepare.outputs.base }}
      head: ${{ needs.prepare.outputs.head }}
      app_id: ${{ needs.prepare.outputs.app_id }}
      tracker: ${{ needs.prepare.outputs.tracker }}
      control_repo: microsoft/go-infra
      control_sha: ${{ needs.prepare.outputs.control_sha }}
