name: Apply one dependency audit area

on:
  workflow_call:
    secrets:
      DEPENDENCY_AUDIT_APP_PRIVATE_KEY:
        required: false
    inputs:
      target_repo:
        required: true
        type: string
      area:
        required: true
        type: string
      issue:
        default: 0
        type: number
      replace_pr:
        default: 0
        type: number
      app_id:
        description: "Optional App client ID; without an App, publish an Open a PR link"
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Enrolled repository in owner/repo form"
        required: true
        type: string
      area:
        description: "Stable area slug from the current modernization tracker"
        required: true
        type: string
      issue:
        description: "Current tracker issue number, or 0 to find it automatically"
        default: 0
        type: number
      replace_pr:
        description: "Closed, unmerged migration PR to explicitly replace, or 0"
        default: 0
        type: number

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ inputs.target_repo }}
  cancel-in-progress: false

jobs:
  prepare:
    uses: ./.github/workflows/dependency-audit-prepare.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      mode: apply
      target_repo: ${{ inputs.target_repo }}
      area: ${{ inputs.area }}
      issue: ${{ inputs.issue }}
      replace_pr: ${{ inputs.replace_pr }}
      app_id: ${{ inputs.app_id || vars.DEPENDENCY_AUDIT_APP_ID }}

  apply:
    needs: prepare
    if: needs.prepare.outputs.existing == 'false'
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      copilot-requests: write
    uses: ./.github/workflows/dependency-audit-apply-agent.lock.yml
    secrets: inherit
    with:
      target_repo: ${{ inputs.target_repo }}
      owner: ${{ needs.prepare.outputs.owner }}
      repo: ${{ needs.prepare.outputs.repo }}
      key: ${{ needs.prepare.outputs.key }}
      branch: ${{ needs.prepare.outputs.branch }}
      head: ${{ needs.prepare.outputs.head }}
      work_branch: ${{ needs.prepare.outputs.work_branch }}
      module: ${{ needs.prepare.outputs.module }}
      issue: ${{ needs.prepare.outputs.issue }}
      replaces: ${{ needs.prepare.outputs.replaces }}
      area: ${{ inputs.area }}
      app_id: ${{ needs.prepare.outputs.app_id }}
      publisher: ${{ needs.prepare.outputs.publisher }}
      tracker: ${{ needs.prepare.outputs.tracker }}
      control_repo: microsoft/go-infra
      control_sha: ${{ needs.prepare.outputs.control_sha }}

  link:
    needs: [prepare, apply]
    uses: ./.github/workflows/dependency-audit-prepare.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      mode: link
      target_repo: ${{ inputs.target_repo }}
      area: ${{ inputs.area }}
      issue: ${{ inputs.issue }}
      replace_pr: ${{ inputs.replace_pr }}
      app_id: ${{ needs.prepare.outputs.app_id }}
