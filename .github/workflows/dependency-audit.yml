name: Dependency history audit

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Enrolled owner/repo, or empty to audit every enrolled repository"
        default: ""
        type: string
      initial_sha:
        description: "Exclusive starting commit for one repository's first audit"
        default: ""
        type: string

permissions:
  actions: write
  contents: read
  copilot-requests: write

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      repositories: ${{ steps.targets.outputs.repositories }}
    steps:
      - name: Require the central default branch
        if: github.event.repository.fork == true || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Dependency audits must run from the central repository's default branch."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Select enrolled repositories
        id: targets
        env:
          DEPENDENCY_AUDIT_REPOSITORIES: ${{ vars.DEPENDENCY_AUDIT_REPOSITORIES }}
          TARGET_REPOSITORY: ${{ inputs.target_repo }}
          INITIAL_SHA: ${{ inputs.initial_sha }}
        run: go run ./cmd/dependencyaudit targets -repo "$TARGET_REPOSITORY" -initial-sha "$INITIAL_SHA"

  audit:
    needs: targets
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
      copilot-requests: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repository: ${{ fromJSON(needs.targets.outputs.repositories) }}
    uses: ./.github/workflows/dependency-audit-target.yml
    secrets: inherit
    with:
      target_repo: ${{ matrix.repository }}
      initial_sha: ${{ inputs.initial_sha || '' }}
